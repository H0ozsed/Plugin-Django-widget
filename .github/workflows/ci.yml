name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/widget_hub/static/widget_hub/dashboard.js
      - run: node --test "tests/js/*.test.js"

  package:
    # Build the sdist/wheel and run the example project against the *installed* wheel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a fresh virtualenv
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install "$(ls dist/*.whl)[ninja,drf]" pytest pytest-django
      - name: Run the example against the installed package
        run: |
          cp -r example /tmp/example
          cd /tmp/example
          /tmp/fresh/bin/python -c "import widget_hub; assert 'site-packages' in widget_hub.__file__"
          /tmp/fresh/bin/python manage.py check
          /tmp/fresh/bin/python manage.py migrate --noinput
          /tmp/fresh/bin/python -m pytest -p no:cacheprovider demo_widgets --ds=example_project.settings

  test:
    name: py${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported Django series and the Python versions each one supports
        # (https://docs.djangoproject.com/en/dev/faq/install/).
        include:
          - { django: "5.2", python: "3.10" }
          - { django: "5.2", python: "3.11" }
          - { django: "5.2", python: "3.12" }
          - { django: "5.2", python: "3.13" }
          - { django: "5.2", python: "3.14" }
          - { django: "6.0", python: "3.12" }
          - { django: "6.0", python: "3.13" }
          - { django: "6.0", python: "3.14" }
          - { django: "6.1", python: "3.12" }
          - { django: "6.1", python: "3.13" }
          - { django: "6.1", python: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: pip install -e ".[dev]" "Django~=${{ matrix.django }}.0"
      - run: pytest --cov=widget_hub --cov-report=term-missing
      - name: Example widgets
        run: pytest example/demo_widgets --ds=example_project.settings -p no:cacheprovider
      - name: Example project starts
        working-directory: example
        env:
          PYTHONPATH: .
        run: |
          python manage.py check
          python manage.py migrate --noinput
